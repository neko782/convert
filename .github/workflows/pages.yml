name: Publish to GitHub Pages

on:
  push:
    branches: ["master"]
  pull_request:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    # bun install runs with lifecycle scripts disabled, so puppeteer never
    # downloads a browser; use the Chrome preinstalled on the runner.
    env:
      PUPPETEER_EXECUTABLE_PATH: /usr/bin/google-chrome

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
          cache: true

      - name: Check artifacts are up to date
        run: bun run artifacts:check

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Cache vendored archives
        uses: actions/cache@v5
        with:
          path: .cache/vendor
          key: vendor-${{ hashFiles('third_party/sources.js') }}

      - name: Build
        run: bun run build

      - name: Generate cache
        run: bun run cache:build

      - name: Test traversion graph
        run: bun test test/TraversionGraph.test.ts

      - name: Test common conversion routes
        run: bun test test/commonFormats.test.ts

      - name: Upload Pages artifact
        if: github.event_name == 'push'
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
