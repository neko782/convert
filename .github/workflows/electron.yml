name: Build Electron Releases

on:
  push:
    branches: ["master"]

permissions:
  contents: write

jobs:
  build-electron:
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux
            chrome: /usr/bin/google-chrome
          - os: windows-2025
            platform: win
            chrome: C:\Program Files\Google\Chrome\Application\chrome.exe
          - os: macos-15
            platform: mac
            chrome: /Applications/Google Chrome.app/Contents/MacOS/Google Chrome

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
          cache: true

      # electron's install script must run; puppeteer's browser download is
      # skipped since the cache step uses the Chrome preinstalled on the runner.
      - name: Install dependencies
        run: bun install --frozen-lockfile
        env:
          PUPPETEER_SKIP_DOWNLOAD: 1

      - name: Cache vendored archives
        uses: actions/cache@v5
        with:
          path: .cache/vendor
          key: vendor-${{ hashFiles('third_party/sources.js') }}

      - name: Build Distribution for ${{ matrix.platform }}
        run: bun run desktop:dist:${{ matrix.platform }}
        env:
          PUPPETEER_EXECUTABLE_PATH: ${{ matrix.chrome }}

      - name: Publish GitHub Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: latest
          name: Rolling Release
          prerelease: true
          overwrite_files: true
          files: |
            release/*.exe
            release/*.dmg
            release/*.AppImage
            release/*.zip
            release/*.snap
            release/*.deb
          body: "This release contains offline Electron builds of convert.to.it, built from the latest commit on the `master` branch."
